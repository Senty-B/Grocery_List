<section class="space-y-4">
  <section id="active-items" class="rounded-[1rem] border border-cream-200 bg-white/80 p-4 shadow-sm backdrop-blur sm:p-5">
    <div class="mb-3 flex items-center justify-between gap-4">
      <h2 class="text-sm font-semibold uppercase tracking-[0.15em] text-clay-600">To buy</h2>
      <span class="text-xs font-semibold text-ink-400">{{ active_items|length }}</span>
    </div>

    <div id="active-items-container" class="space-y-2">
      {% if active_items %}
        {% for item in active_items %}
          {% include "grocery/_item_row.html" %}
        {% endfor %}
      {% else %}
        <p class="py-6 text-center text-sm text-ink-400">No items yet.</p>
      {% endif %}
    </div>
  </section>

  {% include "grocery/_checked_list.html" %}
</section>
