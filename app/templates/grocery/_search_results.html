{% if results.favorites or results.history or results.recommendations %}
  <div class="bg-white">
    <ul data-search-results-list class="overflow-y-auto overscroll-contain py-1 [-webkit-overflow-scrolling:touch]">
      {% for favorite in results.favorites %}
        <li>
          <button
            type="button"
            data-fill-name="{{ favorite.name|e }}"
            data-fill-quantity="{{ favorite.default_quantity_value }}"
            data-fill-unit="{{ (favorite.default_unit or '')|e }}"
            data-fill-note="{{ (favorite.default_note or '')|e }}"
            class="flex min-h-[3rem] w-full items-center gap-3 px-4 py-3 text-left text-sm text-ink-700 transition hover:bg-moss-50 focus:outline-none focus:bg-moss-50"
          >
            <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-moss-100 text-xs font-bold text-moss-700">
              F
            </span>
            <span class="min-w-0">
              <span class="block truncate font-semibold text-ink-900">{{ favorite.name }}</span>
              <span class="block truncate text-xs text-ink-400">
                Favorite{% if favorite.default_unit %} - {{ favorite.default_unit }}{% endif %}
              </span>
            </span>
          </button>
        </li>
      {% endfor %}

      {% for history_item in results.history %}
        <li>
          <button
            type="button"
            data-fill-name="{{ history_item|e }}"
            class="flex min-h-[3rem] w-full items-center gap-3 px-4 py-3 text-left text-sm text-ink-700 transition hover:bg-cream-50 focus:outline-none focus:bg-cream-50"
          >
            <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-cream-100 text-xs font-bold text-clay-700">
              R
            </span>
            <span class="min-w-0">
              <span class="block truncate font-semibold text-ink-900">{{ history_item }}</span>
              <span class="block truncate text-xs text-ink-400">Recent item</span>
            </span>
          </button>
        </li>
      {% endfor %}

      {% for recommendation in results.recommendations %}
        <li>
          <button
            type="button"
            data-fill-name="{{ recommendation|e }}"
            class="flex min-h-[3rem] w-full items-center gap-3 px-4 py-3 text-left text-sm text-ink-700 transition hover:bg-honey-50 focus:outline-none focus:bg-honey-50"
          >
            <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-honey-100 text-xs font-bold text-honey-700">
              E
            </span>
            <span class="min-w-0">
              <span class="block truncate font-semibold text-ink-900">{{ recommendation }}</span>
              <span class="block truncate text-xs text-ink-400">Empfehlung</span>
            </span>
          </button>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
