{% if current_user.is_authenticated %}
<nav class="fixed inset-x-0 bottom-0 z-40">
  <div class="w-full">
  <div class="grid grid-cols-3 gap-2 border-t border-black bg-white px-2 pt-2 pb-[max(0.85rem,env(safe-area-inset-bottom))]">
    <a
      href="{{ url_for('grocery.index') }}"
      aria-current="{% if request.path.startswith('/grocery') or request.path == '/' %}page{% else %}false{% endif %}"
      class="flex flex-col items-center justify-center"
    >
      <div class="flex min-h-[3rem] w-full min-w-20 flex-col items-center justify-center gap-1 rounded-[0.75rem] px-3 py-2 text-xs font-semibold transition
      {% if request.path.startswith('/grocery') or request.path == '/' %}
        bg-cream-200 text-ink-900
      {% else %}
        text-ink-400 hover:bg-cream-100 hover:text-ink-700
      {% endif %}">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <span>List</span>
      </div>
    </a>
    <a
      href="{{ url_for('favorites.index') }}"
      aria-current="{% if request.path.startswith('/favorites') %}page{% else %}false{% endif %}"
      class="flex flex-col items-center justify-center"
    >
      <div class="flex min-h-[3rem] w-full min-w-20 flex-col items-center justify-center gap-1 rounded-[0.75rem] px-3 py-2 text-xs font-semibold transition
      {% if request.path.startswith('/favorites') %}
        bg-cream-200 text-ink-900
      {% else %}
        text-ink-400 hover:bg-cream-100 hover:text-ink-700
      {% endif %}">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118L2.98 10.1c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
        </svg>
        <span>Favorites</span>
      </div>
    </a>
    <a
      href="{{ url_for('household.index') }}"
      aria-current="{% if request.path.startswith('/household') %}page{% else %}false{% endif %}"
      class="flex flex-col items-center justify-center"
    >
      <div class="flex min-h-[3rem] w-full min-w-20 flex-col items-center justify-center gap-1 rounded-[0.75rem] px-3 py-2 text-xs font-semibold transition
      {% if request.path.startswith('/household') %}
        bg-cream-200 text-ink-900
      {% else %}
        text-ink-400 hover:bg-cream-100 hover:text-ink-700
      {% endif %}">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1" />
        </svg>
        <span>Household</span>
      </div>
    </a>
  </div>
  </div>
</nav>
{% endif %}
